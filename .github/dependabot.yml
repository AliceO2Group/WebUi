version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
  labels:
    - "github-actions"
    - "dependencies"
  open-pull-requests-limit: 3
- package-ecosystem: npm
  directory: "/Control"
  schedule:
    interval: weekly
    day: "tuesday"
    time: "07:00"
    timezone: "Europe/Zurich"
  groups:
    dev-dependencies:
      patterns:
        # - "eslint"
        - "mocha"
        - "nock"
        - "nyc"
        - "puppeteer"
        - "sinon"
    grpc:
      patterns:
        - "@grpc/grpc-js"
        - "@grpc/proto-loader"
  labels:
    - "Control"
    - "dependencies"
  open-pull-requests-limit: 10
  versioning-strategy: increase
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-patch"]
- package-ecosystem: npm
  directory: "/QualityControl"
