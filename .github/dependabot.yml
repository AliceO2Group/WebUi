        - "@stylistic/eslint-plugin-js"
        - "eslint-plugin-jsdoc"
        - "globals"
        - "mocha"
        - "nock"
        - "nyc"
        - "puppeteer"
        - "sinon"
  labels:
    - "Quality Control"
    - "dependencies"
  open-pull-requests-limit: 10
  versioning-strategy: increase
  ignore:
    - dependency-name: "*"
      update-types: ["version-update:semver-patch"]
