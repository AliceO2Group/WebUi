services:
  install-backend:
    image: node:22-alpine
    working_dir: /var/workspace/central-system
    volumes:
      - ./backend:/var/workspace
    command: ['npm', 'install', '--no-save', '--silent']
  backend:
    image: node:22-alpine
    working_dir: /var/workspace/central-system
    volumes:
      - ./backend:/var/workspace
    env_file:
      - ./backend/central-system/.env
    command: ['npm', 'run', 'dev']
    healthcheck:
      interval: 1s
      test:
        [
          'CMD-SHELL',
          'node',
          '-c',
          'node --input-type=module -e "process.exit((await fetch(''http://backend:8080/api/healthcheck'')).ok === true ? 0 : 1)"',
        ]
    depends_on:
      install-backend:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully

  install-webapp:
    image: node:22-alpine
    working_dir: /var/workspace
    volumes:
      - ./webapp:/var/workspace
    command: ['npm', 'install', '--no-save', '--silent']
  webapp:
    image: node:22-alpine
    working_dir: /var/workspace
    volumes:
      - ./webapp:/var/workspace
    command: ['npm', 'run', 'dev', '--', '--host', 'webapp']
    healthcheck:
      interval: 1s
      test:
        [
          'CMD-SHELL',
          'node',
          '-c',
          'node --input-type=module -e "process.exit((await fetch(''http://webapp:5173'')).ok === true ? 0 : 1)"',
        ]
    depends_on:
      backend:
        condition: service_healthy
      install-webapp:
        condition: service_completed_successfully

  reverse-proxy:
    build:
      target: reverse-proxy
    ports:
      - '8080:8080'
      - '4041:4041'
    depends_on:
      backend:
        condition: service_healthy
      webapp:
        condition: service_healthy

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "127.0.0.1:8200:9300"
      - "127.0.0.1:8201:9301"
    environment:
      VAULT_LOCAL_CONFIG: |
        ui = true
        disable_mlock = true
        cluster_name = "dev-raft"

        api_addr     = "https://vault.local:8200"
        cluster_addr = "https://vault.local:8201"

        listener "tcp" {
          address         = "0.0.0.0:9300"   
          cluster_address = "0.0.0.0:9301"
          tls_cert_file   = "/vault/config/vault.crt"
          tls_key_file    = "/vault/config/vault.key"
          tls_client_ca_file = "/vault/config/ca.crt"
        }

        storage "raft" {
          path    = "/vault/data"
          node_id = "node1"
        }
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -e
        docker-entrypoint.sh >/dev/null 2>&1 || true
        exec vault server -config=/vault/config/local.json
    volumes:
      - ./backend/central-system/vault/vault-data:/vault/data
      - ./backend/central-system/vault/vault.crt:/vault/config/vault.crt:ro
      - ./backend/central-system/vault/vault.key:/vault/config/vault.key:ro
      - ./backend/central-system/ca/ca.crt:/vault/config/ca.crt:ro
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
