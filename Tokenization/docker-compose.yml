services:
  install-backend:
    image: node:22-alpine
    working_dir: /var/workspace/central-system
    working_dir: /var/workspace/central-system
    volumes:
      - ./backend:/var/workspace
    command: ['npm', 'install', '--no-save', '--silent']
    command: ['npm', 'install', '--no-save', '--silent']
  backend:
    image: node:22-alpine
    working_dir: /var/workspace/central-system
    working_dir: /var/workspace/central-system
    volumes:
      - ./backend:/var/workspace
    env_file:
      - ./backend/central-system/.env
    command: ['npm', 'run', 'dev']
    healthcheck:
      interval: 1s
      test:
        [
          'CMD-SHELL',
          'node',
          '-c',
          'node --input-type=module -e "process.exit((await fetch(''http://backend:8080/api/healthcheck'')).ok === true ? 0 : 1)"',
        ]
      test:
        [
          'CMD-SHELL',
          'node',
          '-c',
          'node --input-type=module -e "process.exit((await fetch(''http://backend:8080/api/healthcheck'')).ok === true ? 0 : 1)"',
        ]
    depends_on:
      install-backend:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      vault-setup:
        condition: service_completed_successfully

  install-webapp:
    image: node:22-alpine
    working_dir: /var/workspace
    volumes:
      - ./webapp:/var/workspace
    command: ['npm', 'install', '--no-save', '--silent']
    command: ['npm', 'install', '--no-save', '--silent']
  webapp:
    image: node:22-alpine
    working_dir: /var/workspace
    volumes:
      - ./webapp:/var/workspace
    command: ['npm', 'run', 'dev', '--', '--host', 'webapp']
    command: ['npm', 'run', 'dev', '--', '--host', 'webapp']
    healthcheck:
      interval: 1s
      test:
        [
          'CMD-SHELL',
          'node',
          '-c',
          'node --input-type=module -e "process.exit((await fetch(''http://webapp:5173'')).ok === true ? 0 : 1)"',
        ]
      test:
        [
          'CMD-SHELL',
          'node',
          '-c',
          'node --input-type=module -e "process.exit((await fetch(''http://webapp:5173'')).ok === true ? 0 : 1)"',
        ]
    depends_on:
      backend:
        condition: service_healthy
      install-webapp:
        condition: service_completed_successfully

  reverse-proxy:
    build:
      target: reverse-proxy
    ports:
      - '8080:8080'
      - '4041:4041'
      - '8080:8080'
      - '4041:4041'
    depends_on:
      backend:
        condition: service_healthy
      webapp:
        condition: service_healthy
