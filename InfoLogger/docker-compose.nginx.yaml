services:
  application:
    # Only reachable through nginx
    ports: !reset []

  nginx:
    build:
      context: .
      target: nginx
      additional_contexts:
        framework: ../Framework

    ports: ["8080:80"]

    depends_on: [application]

    volumes:
      - type: bind
        read_only: true
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
