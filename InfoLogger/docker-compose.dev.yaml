services:
  application:
    build:
      target: development
    depends_on:
      database:
        condition: service_healthy
        restart: true
    environment:
      NODE_ENV: development
      mariadb_host: database
      infologger_host: simulator
    ports:
      - "8080:8080"
    command: "npm run dev"
    restart: "no"
    volumes:
      - type: bind
        read_only: true
        source: ./lib
        target: /home/node/app/lib
      - type: bind
        read_only: true
        source: ./public
        target: /home/node/app/public
      - type: bind
        read_only: true
        source: ./test
        target: /home/node/app/test
      - type: bind
        read_only: true
        source: ./config.js
        target: /home/node/app/config.js
      - type: bind
        read_only: true
        source: ./index.js
        target: /home/node/app/index.js
  database:
    image: mariadb:11.6.2
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      # uncomment the code below should you want to access the DB using a external program.
    # ports:
    # - "3306:3306"
    volumes:
      - type: bind
        read_only: true
        source: ./INFOLOGGER.sql
        target: /docker-entrypoint-initdb.d/INFOLOGGER.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 20s
      retries: 20
  phpmyadmin:
    image: phpmyadmin:5.2.1
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
        restart: true
    ports:
      - 9090:80
    environment:
      - PMA_HOST=database
  simulator:
    build:
      target: simul
    environment:
      NODE_ENV: development
    restart: "unless-stopped"

volumes:
  database-data:
