name: infologger-dev
services:
  application:
    build:
      target: development

    restart: "no"

    environment:
      NODE_ENV: development

    ports:
      - "8080:8080"
      - "5173:5173" # Vite HMR WS

    volumes:
      - type: bind
        read_only: true
        source: ./lib
        target: /home/node/app/lib
      - type: bind
        read_only: true
        source: ./public
        target: /home/node/app/public
      - type: bind
        read_only: true
        source: ./src
        target: /home/node/app/src
      - type: bind
        read_only: true
        source: ./index.html
        target: /home/node/app/index.html
      - type: bind
        read_only: true
        source: ./vite.config.mjs
        target: /home/node/app/vite.config.mjs
      - type: bind
        read_only: true
        source: ./config.js
        target: /home/node/app/config.js
      - type: bind
        read_only: true
        source: ./index.js
        target: /home/node/app/index.js
        # Use the local Framework source to allow edits from it to come through before it gets released
      - type: bind
        read_only: true
        source: ../Framework
        target: /home/node/app/node_modules/@aliceo2/web-ui
