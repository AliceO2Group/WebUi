services:
  application:
    build:
      target: development
    
    restart: "no"

    depends_on:
      database:
        condition: service_healthy
        restart: true
  
    environment:
      NODE_ENV: development
      mariadb_host: database
      infologger_host: simulator

    ports:
      - "8080:8080"

    volumes:
      - type: bind
        read_only: true
        source: ./lib
        target: /home/node/app/lib
      - type: bind
        read_only: true
        source: ./public
        target: /home/node/app/public
      - type: bind
        read_only: true
        source: ./config.js
        target: /home/node/app/config.js
      - type: bind
        read_only: true
        source: ./index.js
        target: /home/node/app/index.js
  database:
    image: mariadb:11.6.2
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root

    # should you want to access the DB using a external program
    ports:
    - "3306:3306"

    # tmpfs keeps the data dir in RAM, so it starts empty on every run and
    # MariaDB re-applies INFOLOGGER.sql each time (throwaway dev database).
    volumes:
      - type: tmpfs
        target: /var/lib/mysql
      - type: bind
        read_only: true
        source: ./docker/INFOLOGGER.sql
        target: /docker-entrypoint-initdb.d/INFOLOGGER.sql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 20

  simulator:
    build:
      target: simul
    restart: "unless-stopped"
