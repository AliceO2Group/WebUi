services:
  application:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
    ports:
      - "8080:8080"
    container_name: qcg-application-dev
    volumes:
      # Mount the current directory to /usr/src/app cached to improve performance
      - .:/usr/src/app:cached 
      # Ignore local node_modules to avoid conflicts with the container's node_modules
      - /usr/src/app/node_modules
