services:
  test_app:
    build:
      target: test
    environment:
      NODE_ENV: test
      DATABASE_LOGGING: "False"
    restart: "no"

  test_db:
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    restart: "no"
    volumes:
      - type: volume
        read_only: false
        source: database-data
        target: /var/lib/mysql
volumes:
  database-data:
