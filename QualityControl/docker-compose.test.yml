services:
  qcg-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      CHROME_BIN: /usr/bin/chromium-browser
      MYSQL_DATABASE: qcg_test_db
      MYSQL_USER: qcg_test_user
      MYSQL_PASSWORD: testpassword
      MYSQL_ROOT_PASSWORD: testpassword
    volumes:
      - type: bind
        read_only: true
        source: ./lib
        target: /usr/src/app/lib
      - type: bind
        read_only: true
        source: ./public
        target: /usr/src/app/public   
      - type: bind
        source: ./test
        target: /usr/src/app/test
    links:
      - database-test
    ports:
      - "8080:8080"
    container_name: qcg-test-application
    restart: no
    stdin_open: true
    tty: true

  database-test:
    image: "mariadb:10.5.9"
    container_name: qcg-test-database
    environment:
      MYSQL_ROOT_PASSWORD: testpassword
      MYSQL_DATABASE: qcg_test_user
      MYSQL_USER: qcg_test_user
      MYSQL_PASSWORD: testpassword
    volumes:
      - mariadb_test_volume:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mariadb_test_volume: