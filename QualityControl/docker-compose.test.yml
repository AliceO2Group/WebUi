services:
  qcg-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    env_file:
      - .env.test
    environment:
      CHROME_BIN: /usr/bin/chromium-browser
    links:
      - database-test
    ports:
      - "8080:8080"
    container_name: qcg-test-application
    restart: no
    volumes:
      - .:/usr/src/app    
    stdin_open: true
    tty: true
    command: ["npm", "run", "test"]

  database-test:
    image: "mariadb:10.5.9"
    container_name: qcg-test-database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_test_volume:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mariadb_test_volume: